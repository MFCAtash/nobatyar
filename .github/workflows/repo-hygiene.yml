name: Repo hygiene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: GitHub readiness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required files present
        run: |
          for f in README.md LICENSE LEGAL.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md docs/GITHUB-PUBLISH.md; do
            test -s "$f" || { echo "::error::missing or empty $f"; exit 1; }
          done

      - name: Social preview assets present
        run: |
          for f in docs/assets/github/cover-dark-teal.png docs/assets/github/cover-isometric.png docs/assets/github/cover-persian-pattern.png docs/assets/github/cover-neon-glass.png docs/assets/github/cover-aurora-3d.png docs/assets/github/cover-amber-vitality.png docs/assets/github/cover-quantum-mesh.png; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done

      - name: Demo video present
        run: |
          test -s docs/assets/video/video_2026-11-22_19-39-31.mp4 || { echo "::error::missing demo video"; exit 1; }
          test -s docs/assets/video/demo-poster.png || { echo "::error::missing demo poster"; exit 1; }

      - name: No secrets tracked
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env' || true)"
          bad="$(printf '%s\n' "$tracked" | grep -Ev '(^|/)\.env\.(example|production\.example)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::a real .env file is tracked"; printf '%s\n' "$bad"; exit 1
          fi
          echo "no real .env tracked (templates allowed)"

      - name: Package metadata
        run: |
          node -e "const p=require('./package.json'); if(!p.repository||!p.homepage||!p.license||!/All Rights|LICENSE/.test(p.license)) process.exit(1)"
