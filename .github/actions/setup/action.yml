name: Setup workspace
description: Node + pnpm + cache + frozen install (مشترک بین همه‌ی jobها)

runs:
  using: composite
  steps:
    - name: Require committed lockfile
      shell: bash
      run: |
        if [ ! -f pnpm-lock.yaml ]; then
          echo "::error title=pnpm-lock.yaml missing::lockfile commit نشده. یک‌بار 'pnpm install' بزنید و pnpm-lock.yaml را commit کنید (بدون آن نصب قابل‌تکرار و اسکن آسیب‌پذیری معتبر نیست)."
          exit 1
        fi

    # نسخه‌ی pnpm از فیلد packageManager در package.json خوانده می‌شود
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Turborepo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-
          turbo-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
