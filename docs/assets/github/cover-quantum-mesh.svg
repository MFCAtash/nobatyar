<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1280" viewBox="0 0 1280 640" role="img" aria-label="NobatYar quantum mesh 3D cover">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset="0.5" stop-color="#0c4a6e"/><stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <pattern id="mesh" width="54" height="54" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <path d="M27 0 L54 27 L27 54 L0 27 Z" fill="none" stroke="#38bdf8" stroke-opacity="0.16"/>
    </pattern>
    <radialGradient id="halo"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.75"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="b4"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="g4"><feGaussianBlur stdDeviation="8" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg4)"/>
  <rect width="1280" height="640" fill="url(#mesh)"/>
  <circle cx="660" cy="300" r="360" fill="url(#halo)" filter="url(#b4)"/>

  <g transform="translate(820 110) rotate(-7)">
    <rect width="320" height="330" rx="32" fill="url(#card)" stroke="#7dd3fc" stroke-opacity="0.35"/>
    <rect x="26" y="26" width="268" height="50" rx="14" fill="#ffffff" fill-opacity="0.13"/>
    <text x="160" y="58" text-anchor="middle" fill="#e0f2fe" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600">/_api/v1 · 207 ops</text>
    <g fill="#ffffff" fill-opacity="0.12">
      <rect x="26" y="100" width="120" height="48" rx="12"/><rect x="158" y="100" width="136" height="48" rx="12"/>
      <rect x="26" y="162" width="136" height="48" rx="12"/><rect x="174" y="162" width="120" height="48" rx="12"/>
      <rect x="26" y="224" width="268" height="48" rx="12"/>
    </g>
    <rect x="26" y="224" width="268" height="48" rx="12" fill="#38bdf8" opacity="0.65"/>
  </g>

  <g transform="translate(110 392) rotate(5)">
    <rect width="330" height="140" rx="28" fill="url(#card)" stroke="#7dd3fc" stroke-opacity="0.3"/>
    <path d="M28 84 h64 l20 -40 28 78 26 -50 18 12 h126" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" filter="url(#g4)"/>
  </g>

  <text x="440" y="255" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="86" font-weight="800">NOBATYAR</text>
  <text x="444" y="316" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="31">Engineered for clinical reliability</text>
  <text x="446" y="368" fill="#bae6fd" font-family="Inter,Arial,sans-serif" font-size="21">Event-driven · Auditable · Fail-closed by design</text>
  <text x="446" y="560" fill="#e0f2fe" opacity="0.72" font-family="Inter,Arial,sans-serif" font-size="18">PostgreSQL · Redis · BullMQ · OpenTelemetry · Playwright</text>
</svg>
