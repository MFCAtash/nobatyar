<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="نوبت یار - کاور تیره فیروزهای">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="970" cy="180" r="260" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="180" cy="560" r="220" fill="#2dd4bf" opacity="0.12" filter="url(#blur)"/>

  <!-- calendar card -->
  <g transform="translate(840 130)">
    <rect width="300" height="330" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.28"/>
    <rect x="24" y="26" width="252" height="46" rx="14" fill="#ffffff" fill-opacity="0.14"/>
    <text x="150" y="56" text-anchor="middle" fill="#ecfeff" font-family="Vazirmatn,Tahoma,sans-serif" font-size="22">شهریور ۱۴۰۵</text>
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="24" y="96" width="56" height="48" rx="10"/><rect x="92" y="96" width="56" height="48" rx="10"/>
      <rect x="160" y="96" width="56" height="48" rx="10"/><rect x="228" y="96" width="48" height="48" rx="10"/>
      <rect x="24" y="158" width="56" height="48" rx="10"/><rect x="92" y="158" width="56" height="48" rx="10"/>
      <rect x="160" y="158" width="56" height="48" rx="10"/><rect x="228" y="158" width="48" height="48" rx="10"/>
      <rect x="24" y="220" width="56" height="48" rx="10"/><rect x="92" y="220" width="56" height="48" rx="10"/>
    </g>
    <rect x="160" y="158" width="56" height="48" rx="10" fill="#2dd4bf"/>
    <rect x="92" y="220" width="56" height="48" rx="10" fill="#fbbf24" fill-opacity="0.9"/>
  </g>

  <!-- heartbeat -->
  <path d="M40 470 L180 470 L220 420 L260 520 L310 450 L360 470 L520 470"
        fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="260" cy="520" r="10" fill="#fbbf24"/>

  <!-- title, RTL -->
  <g direction="rtl">
    <text x="470" y="285" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn,Tahoma,sans-serif" font-size="74" font-weight="700">نوبت‌یار</text>
    <text x="470" y="350" text-anchor="middle" fill="#99f6e4" font-family="Vazirmatn,Tahoma,sans-serif" font-size="31">رزرو هوشمند نوبت پزشکی</text>
    <text x="470" y="404" text-anchor="middle" fill="#d1fae5" font-family="Vazirmatn,Tahoma,sans-serif" font-size="20" opacity="0.85">ساده · امن · همیشه در دسترس</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="17" fill="#ccfbf1" opacity="0.8">
    <text x="470" y="560" text-anchor="middle">NestJS  ·  Next.js  ·  Prisma  ·  RLS  ·  WebSockets</text>
  </g>
</svg>
