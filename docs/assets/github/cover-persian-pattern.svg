<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="نوبت یار - کاور الگوی ایرانی">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="0.5" stop-color="#047857"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <pattern id="geo" width="96" height="96" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M48 0 L96 48 L48 96 L0 48 Z" fill="none" stroke="#fbbf24" stroke-opacity="0.22" stroke-width="2"/>
      <circle cx="48" cy="48" r="8" fill="#fbbf24" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="centerGlow">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg3)"/>
  <rect width="1280" height="640" fill="url(#geo)"/>
  <circle cx="640" cy="320" r="330" fill="url(#centerGlow)"/>

  <!-- medical cross in a gem -->
  <g transform="translate(1010 320)">
    <path d="M0 -100 L86 -50 L86 50 L0 100 L-86 50 L-86 -50 Z" fill="#ffffff" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M-14 -58 h28 v44 h44 v28 h-44 v44 h-28 v-44 h-44 v-28 h44 Z" fill="#fbbf24"/>
  </g>

  <!-- subtle pulse line -->
  <path d="M70 520 C220 520 250 430 330 430 C410 430 430 560 520 560 C610 560 630 470 730 470"
        fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <g direction="rtl">
    <text x="600" y="270" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn,Tahoma,sans-serif" font-size="88" font-weight="700">نوبت‌یار</text>
    <text x="600" y="340" text-anchor="middle" fill="#fde68a" font-family="Vazirmatn,Tahoma,sans-serif" font-size="32">نوبت دهی هوشمند · امن · مقیاسپذیر</text>
    <text x="600" y="398" text-anchor="middle" fill="#d1fae5" font-family="Vazirmatn,Tahoma,sans-serif" font-size="21">۱۵ ماژول · ۲۰۷ endpoint · ۹۰۰+ تست</text>
  </g>
  <text x="600" y="560" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#fde68a" opacity="0.8">PostgreSQL RLS · Vault KMS · Outbox · Audit · WebSockets</text>
</svg>
