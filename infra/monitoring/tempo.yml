server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m
compactor:
  compaction:
    compaction_window: 1h
    block_retention: 24h
storage:
  trace:
    backend: local
    wal: { path: /tempo/wal }
    local: { path: /tempo/blocks }
# OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318 در سرویس API تنظیم شود.
# scrubbing spanها در tracing-register.ts قبل از خروج از پروسه انجام میشود.
