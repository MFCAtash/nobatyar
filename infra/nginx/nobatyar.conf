# نوبتیار — reverse proxy (nginx) با پشتیبانی SSE و WebSocket
# نمونه‌ی production؛ دامنه/گواهی/پورت‌ها را عوض کنید. (TLS خودکار با Caddy: docs/sse-redis.md)
#
# چرا مسیر SSE جداست؟ nginx به‌طور پیش‌فرض پاسخ upstream را «بافر» می‌کند ⇒ رویدادها تا پر شدن بافر
# یا پایان اتصال به مرورگر نمی‌رسند. برای stream باید proxy_buffering off باشد.

upstream nobatyar_api { server 127.0.0.1:3000; keepalive 64; }
upstream nobatyar_web { server 127.0.0.1:3001; keepalive 16; }

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 80;
    server_name example.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.ir;

    ssl_certificate     /etc/letsencrypt/live/example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ir/privkey.pem;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── SSE اعلان‌ها: بافر خاموش ─────────────────────────────────────────────
    location = /api/v1/notifications/stream {
        proxy_pass http://nobatyar_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";        # keep-alive به upstream

        proxy_buffering off;                   # ← مهم‌ترین خط: هر رویداد فوراً به کلاینت برود
        proxy_cache off;
        gzip off;                              # فشرده‌سازی هم جریان را بافر می‌کند
        chunked_transfer_encoding on;

        # heartbeat هر ۲۵ ثانیه است و عمر هر stream ≤ ۱۵ دقیقه؛ این مقدار فقط باید از فاصله‌ی heartbeat بیشتر باشد
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ── چت (socket.io، فقط websocket) ────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://nobatyar_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ── بقیه‌ی API ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://nobatyar_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 12m;
    }

    # ── وب ───────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://nobatyar_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
