# لایهٔ محافظت لبه (WAF) — شامل در infra/nginx/nobatyar.conf شود
# نرخها محافظهکارانهاند تا کاربران پشت NAT مشترک دچار مشکل نشوند.

limit_req_zone $binary_remote_addr zone=nvy_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nvy_api:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=nvy_conn:10m;

server {
    # مسیرهای حساس احراز هویت
    location ~ ^/api/v1/auth/(otp|passkey)/ {
        limit_req zone=nvy_auth burst=5 nodelay;
        limit_req_status 429;
        limit_conn nvy_conn 5;
        proxy_pass http://api_upstream;
    }

    # رباتهای شناختهشده
    if ($http_user_agent ~* "(semrush|ahrefs|python-requests|curl/|wget/|scrapy)") {
        return 403;
    }

    # درخواستهای بدون User-Agent یا با Accept suspicious
    if ($http_user_agent = "") { return 403; }

    # هدرهای امنیتی
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # بدنههای بزرگ
    client_max_body_size 2m;

    # صفحهٔ چالش: سرویس باید 429 را با لینک تأیید انسانی برگرداند.
    error_page 429 = @challenge;
    location @challenge {
        default_type application/json;
        return 429 '{"error":"challenge_required","retryAfterSec":60}';
    }
}
