# فاز ۱۹ — تکمیل مرکز فرمان: Grafana + Loki + Tempo + Promtail.
# اجرا:
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml -f docker-compose.observability.yml up -d
# تمام پورتها فقط روی localhostاند؛ دسترسی از راه دور با SSH tunnel/VPN.
# ⚠️ هیچ لاگ/TRACE نباید حاوی داده سلامت باشد؛ scrubbing در packages/shared/src/scrub.ts و tracing-register.ts اجباری است.
services:
  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes: ["./infra/monitoring/loki.yml:/etc/loki/loki.yml:ro", "lokidata:/loki"]
    ports: ["127.0.0.1:3100:3100"]
    networks: [backend]
    restart: unless-stopped
  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - "./infra/monitoring/promtail.yml:/etc/promtail/promtail.yml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
    networks: [backend]
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.3.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes: ["./infra/monitoring/tempo.yml:/etc/tempo/tempo.yml:ro", "tempodata:/tempo"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318", "127.0.0.1:3200:3200"]
    networks: [backend]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_PORT: "3002"
    volumes:
      - "./infra/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro"
      - "./infra/monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro"
      - "./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro"
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3002:3002"]
    networks: [backend]
    restart: unless-stopped

volumes:
  lokidata:
  tempodata:
  grafanadata:
